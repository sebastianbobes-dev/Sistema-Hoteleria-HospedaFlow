<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HospedaFlow - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<div class="container login-contenedor">
    <div class="text-center mb-4">
        <h1 class="login-titulo">HospedaFlow</h1>
        <p class="text-muted mb-1">Gestión hotelera para hoteles pequeños y medianos</p>
        <small class="text-muted">Conexión con el servidor: <strong id="connection-status">Comprobando...</strong></small>
    </div>

    <div class="card">
        <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs border-0" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="tabLogin" data-bs-toggle="tab" data-bs-target="#panelLogin" type="button">Iniciar sesión</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="tabRegistro" data-bs-toggle="tab" data-bs-target="#panelRegistro" type="button">Registro de huésped</button>
                </li>
            </ul>
        </div>
        <div class="card-body tab-content">

            <!-- Login y selección de rol -->
            <div class="tab-pane fade show active" id="panelLogin">
                <form id="formLogin" novalidate>
                    <div class="mb-3">
                        <label for="loginRol" class="form-label">Rol</label>
                        <select id="loginRol" class="form-select" required>
                            <option value="HUESPED">Huésped</option>
                            <option value="RECEPCIONISTA">Recepcionista</option>
                            <option value="GERENTE">Gerente (Administrador)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Correo electrónico</label>
                        <input type="email" id="loginEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control" required>
                    </div>
                    <button type="submit" id="btnLogin" class="btn btn-hospeda w-100">Ingresar</button>
                </form>
            </div>

            <!-- Registro de huésped (UsuarioRequestDTO) -->
            <div class="tab-pane fade" id="panelRegistro">
                <form id="formRegistro" novalidate>
                    <div class="mb-3">
                        <label for="regNombre" class="form-label">Nombre completo</label>
                        <input type="text" id="regNombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Correo electrónico</label>
                        <input type="email" id="regEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="regTelefono" class="form-label">Teléfono</label>
                        <input type="tel" id="regTelefono" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Contraseña</label>
                        <input type="password" id="regPassword" class="form-control" minlength="4" required>
                    </div>
                    <button type="submit" id="btnRegistrar" class="btn btn-hospeda w-100">Crear cuenta de huésped</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/perfiles.js"></script>
<script src="../js/app.js" defer></script>
</body>
</html>
