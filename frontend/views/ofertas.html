<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HospedaFlow - Ofertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div id="barraNavegacion"></div>

<div class="container my-4">
    <h2 class="mb-4">Promociones y descuentos</h2>

    <div class="row g-4">
        <!-- Formulario (OfertaRequestDTO) - solo Gerente -->
        <div class="col-lg-4" id="columnaFormularioOferta">
            <div class="card">
                <div class="card-header">Crear oferta</div>
                <div class="card-body">
                    <form id="formOferta" novalidate>
                        <div class="mb-3">
                            <label for="ofTitulo" class="form-label">Título</label>
                            <input type="text" id="ofTitulo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="ofDescripcion" class="form-label">Descripción</label>
                            <textarea id="ofDescripcion" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="ofDescuento" class="form-label">Descuento (%)</label>
                            <input type="number" id="ofDescuento" class="form-control" min="1" max="100" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="ofFechaInicio" class="form-label">Vigente desde</label>
                            <input type="date" id="ofFechaInicio" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="ofFechaFin" class="form-label">Vigente hasta</label>
                            <input type="date" id="ofFechaFin" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="ofHabitacion" class="form-label">Habitación (opcional)</label>
                            <select id="ofHabitacion" class="form-select">
                                <option value="">Sin habitación específica</option>
                            </select>
                        </div>
                        <button type="submit" id="btnGuardarOferta" class="btn btn-hospeda w-100">Guardar oferta</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Listado -->
        <div class="col-lg-8" id="columnaListaOfertas">
            <div class="card">
                <div class="card-header">Ofertas registradas</div>
                <div class="card-body tabla-contenedor">
                    <table class="table table-hover align-middle mb-0" id="tablaOfertas">
                        <thead>
                        <tr>
                            <th>Título</th><th>Descripción</th><th>Descuento</th><th>Vigencia</th>
                            <th>Hab.</th><th>Estado</th><th class="text-end" id="encabezadoAccionesOferta">Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="cuerpoTablaOfertas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/comun.js"></script>
<script src="/js/ofertas.js"></script>
</body>
</html>
