<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HospedaFlow - Panel del Gerente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<div id="barraNavegacion"></div>

<div class="container my-4">
    <!-- Pestañas principales de navegación del Gerente -->
    <ul class="nav nav-pills mb-4 gap-2" id="tabsGerente" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold px-4" id="tab-habitaciones" data-bs-toggle="pill" data-bs-target="#panel-habitaciones" type="button" role="tab">
                🏨 Gestión de Habitaciones
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold px-4" id="tab-recepcionistas" data-bs-toggle="pill" data-bs-target="#panel-recepcionistas" type="button" role="tab">
                👤 Gestión de Recepcionistas (Personal)
            </button>
        </li>
    </ul>

    <div class="tab-content" id="contenidoGerente">
        <!-- PANEL 1: HABITACIONES -->
        <div class="tab-pane fade show active" id="panel-habitaciones" role="tabpanel" aria-labelledby="tab-habitaciones">
            <div class="row g-4">
                <!-- Formulario (HabitacionRequestDTO) -->
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header">Registrar habitación</div>
                        <div class="card-body">
                            <form id="formHabitacion" novalidate>
                                <div class="mb-3">
                                    <label for="habNumero" class="form-label">Número</label>
                                    <input type="text" id="habNumero" class="form-control" required placeholder="Ej. 101">
                                </div>
                                <div class="mb-3">
                                    <label for="habTipo" class="form-label">Tipo</label>
                                    <select id="habTipo" class="form-select" required>
                                        <option value="Sencilla">Sencilla</option>
                                        <option value="Doble">Doble</option>
                                        <option value="Suite">Suite</option>
                                        <option value="Familiar">Familiar</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="habPrecio" class="form-label">Precio base (por noche)</label>
                                    <input type="number" id="habPrecio" class="form-control" min="0.01" step="0.01" required placeholder="Ej. 100.00">
                                </div>
                                <div class="mb-3">
                                    <label for="habCapacidad" class="form-label">Capacidad (personas)</label>
                                    <input type="number" id="habCapacidad" class="form-control" min="1" step="1" required placeholder="Ej. 2">
                                </div>
                                <button type="submit" id="btnGuardarHabitacion" class="btn btn-hospeda w-100">Guardar habitación</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Listado de Habitaciones -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <span>Habitaciones registradas</span>
                            <select id="filtroEstado" class="form-select form-select-sm w-auto">
                                <option value="">Todos los estados</option>
                                <option value="DISPONIBLE">Disponible</option>
                                <option value="OCUPADA">Ocupada</option>
                                <option value="MANTENIMIENTO">Mantenimiento</option>
                            </select>
                        </div>
                        <div class="card-body tabla-contenedor">
                            <table class="table table-hover align-middle mb-0" id="tablaHabitaciones">
                                <thead>
                                <tr>
                                    <th>Nº</th><th>Tipo</th><th>Precio base</th><th>Capacidad</th><th>Estado</th><th class="text-end">Acciones</th>
                                </tr>
                                </thead>
                                <tbody id="cuerpoTablaHabitaciones"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL 2: RECEPCIONISTAS (CREAR Y ELIMINAR) -->
        <div class="tab-pane fade" id="panel-recepcionistas" role="tabpanel" aria-labelledby="tab-recepcionistas">
            <div class="row g-4">
                <!-- Formulario para Registrar Recepcionista -->
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header">Registrar Recepcionista</div>
                        <div class="card-body">
                            <form id="formRecepcionista" novalidate>
                                <div class="mb-3">
                                    <label for="recNombre" class="form-label">Nombre completo</label>
                                    <input type="text" id="recNombre" class="form-control" required placeholder="Ej. Carlos Mendoza">
                                </div>
                                <div class="mb-3">
                                    <label for="recEmail" class="form-label">Correo electrónico</label>
                                    <input type="email" id="recEmail" class="form-control" required placeholder="carlos@hotel.com">
                                </div>
                                <div class="mb-3">
                                    <label for="recTelefono" class="form-label">Teléfono</label>
                                    <input type="tel" id="recTelefono" class="form-control" required placeholder="04141234567">
                                </div>
                                <div class="mb-3">
                                    <label for="recPassword" class="form-label">Contraseña inicial</label>
                                    <input type="password" id="recPassword" class="form-control" minlength="4" required placeholder="Mínimo 4 caracteres">
                                </div>
                                <button type="submit" id="btnGuardarRecepcionista" class="btn btn-hospeda w-100">Crear recepcionista</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Recepcionistas Registrados -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>Recepcionistas activos</span>
                        </div>
                        <div class="card-body tabla-contenedor">
                            <table class="table table-hover align-middle mb-0" id="tablaRecepcionistas">
                                <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Correo</th>
                                    <th>Teléfono</th>
                                    <th>Rol</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                                </thead>
                                <tbody id="cuerpoTablaRecepcionistas"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/habitaciones.js"></script>
<script src="../js/perfiles.js"></script>
</body>
</html>
