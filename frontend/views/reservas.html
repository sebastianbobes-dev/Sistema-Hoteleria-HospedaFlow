<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HospedaFlow - Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div id="barraNavegacion"></div>

<div class="container my-4">
    <h2 class="mb-4">Registro y consulta de reservas</h2>

    <div class="row g-4">
        <!-- Formulario (ReservaRequestDTO) -->
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">Nueva reserva</div>
                <div class="card-body">
                    <form id="formReserva" novalidate>
                        <div class="mb-3" id="grupoHuesped">
                            <label for="resHuesped" class="form-label">Huésped</label>
                            <select id="resHuesped" class="form-select"></select>
                        </div>
                        <div class="mb-3">
                            <label for="resHabitacion" class="form-label">Habitación</label>
                            <select id="resHabitacion" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="resFechaEntrada" class="form-label">Fecha de entrada</label>
                            <input type="date" id="resFechaEntrada" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="resFechaSalida" class="form-label">Fecha de salida</label>
                            <input type="date" id="resFechaSalida" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="resOferta" class="form-label">Oferta (opcional)</label>
                            <select id="resOferta" class="form-select">
                                <option value="">Sin oferta</option>
                            </select>
                        </div>
                        <button type="submit" id="btnGuardarReserva" class="btn btn-hospeda w-100">Registrar reserva</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Listado -->
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span id="tituloListaReservas">Reservas</span>
                    <select id="filtroEstadoReserva" class="form-select form-select-sm w-auto">
                        <option value="">Todos los estados</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="CONFIRMADA">Confirmada</option>
                        <option value="CANCELADA">Cancelada</option>
                    </select>
                </div>
                <div class="card-body tabla-contenedor">
                    <table class="table table-hover align-middle mb-0" id="tablaReservas">
                        <thead>
                        <tr>
                            <th>Código</th><th>Huésped</th><th>Hab.</th><th>Entrada</th><th>Salida</th>
                            <th>Oferta</th><th>Total</th><th>Estado</th><th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="cuerpoTablaReservas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/comun.js"></script>
<script src="/js/reservas.js"></script>
</body>
</html>
